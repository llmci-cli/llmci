name: "llmci Eval"
description: "Run llmci LLM evals and post results as a PR comment"
inputs:
  compare-to:
    description: "Branch to compare baselines against"
    default: "origin/main"
  github-token:
    description: "Token for posting PR comments"
    default: ${{ github.token }}
  smoke:
    description: "Run on a subset of the dataset"
    default: "false"
  update-baseline:
    description: "Update stored baselines instead of only comparing"
    default: "false"
  config:
    description: "Path to a specific llmci config file"
    default: ""
  all:
    description: "Run all discovered llmci config files"
    default: "false"
  root:
    description: "Directory to search when all is true"
    default: "."
  include:
    description: "Newline-separated globs of discovered config paths to include"
    default: ""
  exclude:
    description: "Newline-separated globs of discovered config paths to exclude"
    default: ""
  output:
    description: "Write report to this file path"
    default: ""
  output-format:
    description: "Report format for output/stdout: markdown, junit, sarif, or json"
    default: "markdown"
  working-directory:
    description: "Directory containing llmci.yaml"
    default: "."
  llmci-version:
    description: "Exact llmci version to install"
    default: "0.2.0"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install llmci
      shell: bash
      run: pip install "llmci==${{ inputs.llmci-version }}"
    - name: Run evals
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_COMPARE_TO: ${{ inputs.compare-to }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_SMOKE: ${{ inputs.smoke }}
        INPUT_UPDATE_BASELINE: ${{ inputs.update-baseline }}
      run: |
        set -euo pipefail

        args=()

        add_patterns() {
          local flag="$1"
          local patterns="$2"
          local pattern
          while IFS= read -r pattern; do
            if [ -n "$pattern" ]; then
              args+=("$flag" "$pattern")
            fi
          done <<< "$patterns"
        }

        if [ "$INPUT_ALL" = "true" ]; then
          args+=("--all" "--root" "$INPUT_ROOT")
          add_patterns "--include" "$INPUT_INCLUDE"
          add_patterns "--exclude" "$INPUT_EXCLUDE"
          if [ -n "$INPUT_OUTPUT" ]; then
            echo "The output input cannot be used when all is true." >&2
            exit 1
          fi
        elif [ -n "$INPUT_CONFIG" ]; then
          args+=("--config" "$INPUT_CONFIG")
        fi

        if [ -n "$INPUT_COMPARE_TO" ]; then
          args+=("--compare-to=$INPUT_COMPARE_TO")
        fi
        if [ "$INPUT_SMOKE" = "true" ]; then
          args+=("--smoke")
        fi
        if [ "$INPUT_UPDATE_BASELINE" = "true" ]; then
          args+=("--update-baseline")
        fi
        if [ -n "$INPUT_OUTPUT" ]; then
          args+=("--output=$INPUT_OUTPUT")
        fi
        if [ -n "$INPUT_OUTPUT_FORMAT" ] && [ "$INPUT_OUTPUT_FORMAT" != "markdown" ]; then
          args+=("--output-format=$INPUT_OUTPUT_FORMAT")
        fi

        llmci run "${args[@]}"
