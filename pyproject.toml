[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmci"
version = "0.1.5"
description = "CI-native regression testing and migration for LLMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["llm", "eval", "evaluation", "ci", "regression", "testing", "prompt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "litellm>=1.40",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/llmci-cli/llmci"
Documentation = "https://github.com/llmci-cli/llmci#readme"
Repository = "https://github.com/llmci-cli/llmci"
Issues = "https://github.com/llmci-cli/llmci/issues"
Changelog = "https://github.com/llmci-cli/llmci/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
agents = [
    "openai-agents>=0.2.0",
]
s3 = [
    "boto3>=1.34",
]

[project.scripts]
llmci = "llmci.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
