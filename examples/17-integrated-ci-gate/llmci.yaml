version: 1

# Default target: ticket routing (per-eval overrides below for the safety eval).
target:
  command: "python3 run_classifier.py --input {input_file} --output {output_file}"

evals:
  # Quality + cost gate: accuracy vs an absolute bar, cost vs a stored baseline.
  - name: support-routing
    level: pipeline
    dataset: ./evals/tickets.jsonl
    judge: exact_match
    metrics:
      - {name: accuracy, threshold: 0.75, mode: absolute}
      - {name: cost_mean, threshold: 0.25, mode: max_regression}
      - {name: tokens_in_mean, threshold: 0.25, mode: max_regression}

  # Safety gate: deterministic PII scan on generated replies (no API key).
  - name: support-safety
    level: pipeline
    dataset: ./evals/tickets.jsonl
    target:
      command: "python3 run_responder.py --input {input_file} --output {output_file}"
    judge:
      type: safety
      criteria:
        - {name: pii_leakage, type: pii_leakage}
    metrics:
      - {name: pii_leakage, threshold: 1.0, mode: absolute}

settings:
  parallelism: 5
  timeout_per_call: 10
  retries: 1
