version: 1

target:
  command: "python3 run_agent.py --input {input_file} --output {output_file}"

evals:
  - name: agent-tool-use
    level: agent
    dataset: ./evals/scenarios.jsonl
    judge:
      type: composite
      criteria:
        - name: constraints
          type: constraint
          weight: 1.0
    metrics:
      - name: mean_score
        threshold: 0.80
        mode: absolute

settings:
  parallelism: 3
  timeout_per_call: 15
