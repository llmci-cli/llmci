name: "llmci Eval"
description: "Run llmci LLM evals and post results as a PR comment"
inputs:
  compare-to:
    description: "Branch to compare baselines against"
    default: "origin/main"
  github-token:
    description: "Token for posting PR comments"
    default: ${{ github.token }}
  smoke:
    description: "Run on a subset of the dataset"
    default: "false"
  output:
    description: "Write report to this file path"
    default: ""
  working-directory:
    description: "Directory containing llmci.yaml"
    default: "."
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install llmci
      shell: bash
      run: pip install llmci
    - name: Run evals
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        ARGS="--compare-to=${{ inputs.compare-to }}"
        if [ "${{ inputs.smoke }}" = "true" ]; then
          ARGS="$ARGS --smoke"
        fi
        if [ -n "${{ inputs.output }}" ]; then
          ARGS="$ARGS --output=${{ inputs.output }}"
        fi
        llmci run $ARGS
