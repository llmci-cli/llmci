version: 1

target:
  direct:
    provider: openai
    model: gpt-4o-mini
  prompt_file: prompt.txt

evals:
  - name: ticket-classification
    level: prompt
    dataset: ./evals/tickets.jsonl
    judge: exact_match
    metrics:
      - name: accuracy
        threshold: 0.90
        mode: absolute
      - name: f1_macro
        threshold: 0.85
        mode: absolute

settings:
  parallelism: 5
  timeout_per_call: 30
  retries: 1
